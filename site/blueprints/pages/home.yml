title: Home
options:
  changeSlug: false
  changeStatus: false
  delete: false
fields:
  eyebrow:
    type: text
  headline:
    label: First headline line
    type: text
  headlinesecond:
    label: Second line ending
    type: text
  headlineaccent:
    label: Second line opening word
    type: text
  intro:
    type: textarea
    buttons: false
  heroimage:
    label: Hero photograph
    help: Use an original portrait photograph, ideally at least 1600px tall. Keep the subject in the lower centre for the responsive crop.
    type: files
    query: site.images
    multiple: false
  introductionheading:
    label: Company introduction heading
    type: text
  introductiontext:
    label: Company introduction
    type: textarea
    buttons: false
    help: A brief, specific explanation of who you are and what you bring.
  sectors:
    label: Sectors we serve
    type: textarea
    buttons: false
  workheading:
    type: text
  brandsheading:
    label: Selected brands heading
    type: text
  brands:
    label: Brands and collaborators
    type: structure
    help: The first six entries marked for the homepage appear in its static grid. All entries appear on About. Reorder entries to change their display order.
    columns:
      name:
        width: 2/3
      featured:
        width: 1/3
    fields:
      name:
        label: Brand name
        type: text
        required: true
      logo:
        label: Logo (optional)
        type: files
        query: page.images
        multiple: false
        uploads:
          template: brand-logo
        help: Without an image, the brand name is displayed clearly instead.
      featured:
        label: Show on homepage
        type: toggle
        default: false
      dark:
        label: Logo needs a dark background
        type: toggle
        default: false
        help: Enable for white artwork that needs contrast.
  metatitle:
    label: Search title
    type: text
  description:
    label: Search description
    type: textarea
    buttons: false
    maxlength: 170
    help: A short, accurate summary for search results.
