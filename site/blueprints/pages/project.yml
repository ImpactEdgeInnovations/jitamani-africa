title: Project
num: default
status:
  draft: Draft
  listed: Published
fields:
  title:
    type: text
    required: true
  category:
    label: Type of experience
    type: text
  location:
    type: text
  intro:
    label: Short introduction
    type: textarea
    buttons: false
  text:
    label: The story
    type: textarea
    buttons:
      - headlines
      - bold
      - link
      - ul
  brief:
    label: The idea (optional)
    type: textarea
    buttons: false
  role:
    label: Jitamani’s role (optional)
    type: textarea
    buttons: false
    help: Describe only your verified responsibilities. Leave blank if not confirmed.
  delivery:
    label: Experience details (optional)
    type: textarea
    buttons: false
  outcome:
    label: Verified outcome (optional)
    type: textarea
    buttons: false
    help: Use only confirmed results. Leave blank rather than adding estimates or unsupported claims.
  cover:
    help: Choose a landscape original, ideally 1600px wide or larger. Keep important subjects away from the edges.
    type: files
    multiple: false
    query: page.images
    uploads:
      template: image
  caption:
    type: text
  gallery:
    type: files
    query: page.images
    uploads:
      template: image
  archive:
    label: Related archive path (optional)
    type: text
    help: For example blogs/existing-article-slug. Only reference verified content.
  description:
    label: Search description
    type: textarea
    buttons: false
